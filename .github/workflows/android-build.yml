name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build signed release APK + AAB (requires signing secrets)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["**.md"]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: "1.0.${{ github.run_number }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (bun.lock)
        run: bun install --frozen-lockfile

      - name: Build web app (production)
        run: bun run build

      - name: Generate app icon + splash from resources/ (if provided)
        run: |
          if [ -f resources/icon.png ]; then
            bunx @capacitor/assets@3 generate --android --iconBackgroundColor '#07090F' --splashBackgroundColor '#07090F'
          else
            echo "::notice::resources/icon.png not found — keeping existing Android icons."
          fi

      - name: Sync Capacitor Android (bundled dist, no live-reload URL)
        run: |
          unset CAP_SERVER_URL
          bunx cap sync android
          test -f android/app/src/main/assets/public/index.html

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stream-netmirror-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check release signing secrets
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not set — skipping signed APK/AAB. Debug APK was built."
          fi

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' && inputs.build_release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify signed release APK
        if: steps.signing.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' && inputs.build_release)
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk"

      - name: Upload release APK
        if: steps.signing.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' && inputs.build_release)
        uses: actions/upload-artifact@v4
        with:
          name: stream-netmirror-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        if: steps.signing.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' && inputs.build_release)
        uses: actions/upload-artifact@v4
        with:
          name: stream-netmirror-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
